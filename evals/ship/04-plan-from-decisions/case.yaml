schema_version: "1.1"
name: plan-from-decisions
description: The plan phase turns settled decisions into vertical, green, flagged chunks and asks for approval before writing code.
tags: [plan]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/skills:ship"
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  disallowed_tools: [EnterPlanMode, ExitPlanMode]
graders:
  - { type: file_exists, name: writes-no-code, path: "src/csv.mjs", exists: false }
  - { type: regex, name: asks-for-approval, pattern: "approv", flags: i }
  - { type: regex, name: uses-feature-scope, pattern: "feat\\(ABC-123\\)" }
  - type: llm
    name: chunks-complete
    criteria: The final message contains a draft plan of 2–5 chunks, and every chunk shows files, an exact acceptance command, a tdd yes/no (with seams when yes), an executor with a reason, and a commit message scoped to ABC-123. Open questions listed alongside the draft are fine.
  - type: llm
    name: chunks-vertical-and-green
    criteria: Each chunk is a vertical slice that could be committed on its own with `node --test` passing and its own tests included; the plan is not layered as "all helpers first, then all logic, then the CLI".
  - type: llm
    name: respects-decisions
    criteria: The plan follows the Decisions (one row per invoice line, locale dates via Intl.DateTimeFormat, two-place amounts without currency symbols, RFC 4180 quoting, delivery as a CLI printing to stdout), includes nothing out of scope (no download UI, no other export formats), and does not ask again about anything the Decisions settle. Questions about genuinely unsettled details are fine.
